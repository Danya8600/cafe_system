{% extends "base.html" %}

{% block title %}Регистрация — Cafe Order{% endblock %}

{% block content %}
<section class="auth-page">
    <form class="auth-card" method="post" action="{{ url_for('auth.register') }}">
        <p class="eyebrow">Регистрация</p>
        <h2>Создание аккаунта клиента</h2>

        <p class="muted">
            При регистрации создаётся пользователь с ролью клиента.
            Аккаунты продавцов создаются отдельно администратором.
        </p>

        <div class="form-group">
            <label for="username">Логин</label>
            <input type="text" id="username" name="username" required minlength="3">
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required minlength="5">
        </div>

        <div class="form-group">
            <label for="password_repeat">Повторите пароль</label>
            <input type="password" id="password_repeat" name="password_repeat" required minlength="5">
        </div>

        <button class="btn btn-wide" type="submit">Зарегистрироваться</button>

        <p class="auth-hint">
            Уже есть аккаунт?
            <a href="{{ url_for('auth.login') }}">Войти</a>
        </p>
    </form>
</section>
{% endblock %}
